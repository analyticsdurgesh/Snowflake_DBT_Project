name: airbnb_snowflake_dbt
version: 1.0.0
config-version: 2

profile: airbnb_snowflake

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
snapshot-paths: ["snapshots"]

clean-targets:
  - target
  - dbt_packages


# On DuckDB, create the few Snowflake functions DuckDB lacks (macros/duckdb_compat.sql).
# On Snowflake this renders nothing and dbt skips it.
on-run-start:
  - "{{ create_duckdb_compat() }}"
models:
  airbnb_snowflake_dbt:
    +persist_docs:
      relation: true
      columns: true

    staging:
      +materialized: view
      +schema: staging

    intermediate:
      +materialized: view
      +schema: intermediate

    marts:
      +materialized: table
      +schema: analytics
