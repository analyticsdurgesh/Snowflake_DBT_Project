name: Airbnb dbt CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  duckdb-linux:
    # The free path exactly as the README gives it: load, build, build again
    # (the incremental merge path), verify every layer, open the dashboard.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-duckdb.txt
          cp profiles.yml.example profiles.yml
      - name: Load RAW
        run: python scripts/load_inside_airbnb_to_duckdb.py
      - name: dbt build
        run: dbt build --target duckdb --profiles-dir .
      - name: dbt build again (incremental run)
        run: dbt build --target duckdb --profiles-dir .
      - name: Verify every layer
        run: python scripts/verify_duckdb_build.py
      - name: Dashboard renders without errors
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          app = AppTest.from_file("dashboard/streamlit_app.py", default_timeout=120).run()
          assert not app.exception, [e.value for e in app.exception]
          assert not app.error, [e.value for e in app.error]
          metrics = {m.label: m.value for m in app.metric}
          print(metrics)
          assert metrics.get("Avg Nightly Price") not in (None, "n/a"), metrics
          PY

  duckdb-windows:
    # The laptop path exactly as the Lab's Windows lessons give it: PowerShell, Python 3.13 (the version the
    # lessons install), a venv, load, build twice (the incremental path), verify, and the dashboard renders.
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: The lessons' commands, in one PowerShell session
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -m venv .venv
          .venv\Scripts\Activate.ps1
          python -m pip install --upgrade pip
          pip install -r requirements-duckdb.txt
          Copy-Item profiles.yml.example profiles.yml
          dbt --version
          python scripts/load_inside_airbnb_to_duckdb.py
          dbt build --target duckdb --profiles-dir .
          dbt build --target duckdb --profiles-dir .
          python scripts/verify_duckdb_build.py
          python -c "from streamlit.testing.v1 import AppTest; app = AppTest.from_file('dashboard/streamlit_app.py', default_timeout=180).run(); assert not app.exception, [e.value for e in app.exception]; assert not app.error, [e.value for e in app.error]; print({m.label: m.value for m in app.metric})"

  duckdb-mac:
    # The same path as the Lab's Mac lessons give it: Terminal, Python 3.13, a venv, load, build twice,
    # verify, the dashboard.
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: The lessons' commands, in one Terminal session
        run: |
          set -euo pipefail
          python3 -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements-duckdb.txt
          cp profiles.yml.example profiles.yml
          dbt --version
          python scripts/load_inside_airbnb_to_duckdb.py
          dbt build --target duckdb --profiles-dir .
          dbt build --target duckdb --profiles-dir .
          python scripts/verify_duckdb_build.py
          python -c "from streamlit.testing.v1 import AppTest; app = AppTest.from_file('dashboard/streamlit_app.py', default_timeout=180).run(); assert not app.exception, [e.value for e in app.exception]; assert not app.error, [e.value for e in app.error]; print({m.label: m.value for m in app.metric})"

  snowflake-parse:
    # The Snowflake path installs and parses on all three computers: every model, ref(), source and test.
    # dbt parse never connects, so the example profile's placeholders are enough.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install the Snowflake adapter
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          cp profiles.yml.example profiles.yml
      - name: Parse for Snowflake
        run: dbt parse --profiles-dir .

  codespace:
    # Builds .devcontainer (what GitHub Codespaces runs) and does the free path inside it,
    # so "Open in Codespaces" is known to work before a learner presses it.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build the dev container and run the project in it
        uses: devcontainers/ci@v0.3
        with:
          push: never
          runCmd: |
            python scripts/load_inside_airbnb_to_duckdb.py
            dbt build --target duckdb --profiles-dir .
            python scripts/verify_duckdb_build.py
